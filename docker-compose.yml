version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecdat-postgres
    restart: always
    environment:
      POSTGRES_DB: ecdat_pqc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7-jammy
    container_name: ecdat-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data:
